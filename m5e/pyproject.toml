[project]
name = "m5e"
version = "0.1.0"
description = "m5e (montage): a folder of clips + a voiceover -> a finished reel in the @kriosfounders style"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "faster-whisper>=1.0",
  "fastembed>=0.5",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "pillow>=10.0",
]

[project.scripts]
m5e = "m5e.cli:main"

[tool.setuptools]
packages = ["m5e"]

[tool.setuptools.package-data]
m5e = ["fonts/*", "models/*", "ui.html"]
