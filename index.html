<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Watchman</title>
    <meta name="description" content="Every aircraft, ship and earthquake we can see, live, on a paper globe." />
    <meta name="theme-color" content="#f2efea" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f2efea' stroke='%232a2724' stroke-width='1.5'/%3E%3Cpath d='M16 6l2.2 7.5 7.3 3.4-7.3 1.6L16 26l-2.2-7.5-7.3-1.6 7.3-3.4z' fill='%23df3a58'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint; system type stands in. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <div id="map" aria-label="Map of live traffic"></div>

    <header class="top">
      <button class="brand" data-act="home" title="Back to the whole globe (G)" aria-label="Watchman: back to the whole globe"><svg class="brand-ic" width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 16h26M16 3c-4.5 4-6 8.5-6 13s1.5 9 6 13M16 3c4.5 4 6 8.5 6 13s-1.5 9-6 13" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span class="brand-t">Watchman</span></button>
      <span class="clock" id="clock" aria-live="off"></span>
      <nav class="nav">
        <button data-act="search" title="Search (/)">Search</button>
        <button data-act="layers" title="Layers (L)">Layers</button>
        <button data-act="news" title="Headlines (H)">News</button>
        <button data-act="nearby" title="What is overhead (O)">Near me</button>
        <button data-act="log" title="Spacecraft, launches, drones, military (K)">Log</button>
        <button data-act="index" title="Index (I)">Index</button>
        <button data-act="about" class="nav-about" title="About (?)">About</button>
      </nav>
    </header>

    <div class="notice" id="notice" role="status" hidden></div>
    <div class="alerts" id="alerts" aria-live="polite"></div>
    <div class="caption" id="caption" aria-live="polite"><div class="caption-t"></div><div class="caption-s"></div></div>
    <aside class="panel" id="panel" aria-label="Details"></aside>
    <div class="pop" id="layers" role="dialog" aria-label="Layers" hidden></div>
    <div class="search" id="search" role="dialog" aria-label="Search" hidden></div>
    <aside class="drawer" id="news" aria-label="Headlines" hidden></aside>
    <aside class="drawer" id="nearby" aria-label="Overhead" hidden></aside>
    <aside class="drawer" id="log" aria-label="Log" hidden></aside>
    <div class="radar-ctl" id="radar-ctl" hidden></div>
    <footer class="status" id="status"></footer>
    <div class="legend" id="legend"></div>
    <section class="index" id="index" aria-label="Index" hidden></section>
    <section class="about" id="about" aria-label="About" hidden></section>
    <div class="intro" id="intro"><div class="intro-word">Watchman</div><div class="intro-lines" id="intro-lines"></div></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
